<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S. — Assistant</title>
<style>
  :root{ --cyan:#5ad9ff; --cyan-dim:#2b8bb0; --gold:#ffcf6b; --glow:0 0 6px rgba(90,217,255,.9),0 0 18px rgba(90,217,255,.5); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:var(--cyan);
    font-family:"Helvetica Neue",-apple-system,"SF Mono",Menlo,monospace;-webkit-user-select:none;user-select:none;cursor:none;}
  #stage{position:fixed;inset:0;opacity:0;transition:opacity .4s ease;
    background:radial-gradient(ellipse at center,rgba(0,8,16,.5)0%,rgba(0,4,10,.86)70%,rgba(0,2,6,.95)100%);}
  #stage.on{opacity:1}
  #stage::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(90,217,255,.03)0 1px,transparent 1px 3px);mix-blend-mode:screen;}

  /* reactor core, scales with audio level */
  .reactor{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;display:grid;place-items:center;
    filter:drop-shadow(0 0 22px rgba(90,217,255,.55));}
  .ring{position:absolute;border-radius:50%}
  .r1{width:300px;height:300px;border:1px dashed rgba(90,217,255,.35);animation:spin 18s linear infinite}
  .r2{width:230px;height:230px;border:2px solid transparent;border-top-color:var(--cyan);border-bottom-color:var(--cyan);animation:spin 6s linear infinite reverse}
  .r3{width:180px;height:180px;border:1px solid rgba(255,207,107,.4);animation:spin 11s linear infinite}
  .core{width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,#eafdff 0%,var(--cyan)30%,var(--cyan-dim)60%,rgba(20,60,80,.2)82%,transparent 100%);
    box-shadow:0 0 40px rgba(90,217,255,.9),inset 0 0 30px rgba(255,255,255,.6);transition:transform .08s ease;}
  body.thinking .r2{animation-duration:1.4s}
  body.speaking .core{box-shadow:0 0 60px var(--gold),inset 0 0 30px #fff}

  #statusline{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(150px);text-align:center;
    font-size:13px;letter-spacing:.32em;color:var(--cyan-dim);text-shadow:var(--glow);text-transform:uppercase;}
  #tools{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(186px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:80vw}
  .chip{font-size:10px;letter-spacing:.18em;border:1px solid rgba(90,217,255,.4);border-radius:10px;padding:2px 9px;color:var(--cyan);text-shadow:var(--glow);opacity:.9}

  #transcript{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:min(720px,82vw);text-align:center;
    font-size:15px;letter-spacing:.06em;color:#cdf3ff;text-shadow:var(--glow);min-height:22px;opacity:.95}
  #response{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:min(820px,84vw);text-align:center;
    font-size:21px;line-height:1.5;letter-spacing:.04em;color:#eafdff;text-shadow:var(--glow);}
  .hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.22em;color:var(--cyan-dim);opacity:.7}

  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage">
  <div class="reactor">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core" id="core"></div>
  </div>
  <div id="transcript"></div>
  <div id="statusline">CONNECTING…</div>
  <div id="tools"></div>
  <div id="response"></div>
  <div class="hint">⌥⌘J — konuşmak için dokun · konuşurken dokun = sus · Esc kapatır</div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage');
  const core=document.getElementById('core');
  const statusEl=document.getElementById('statusline');
  const toolsEl=document.getElementById('tools');
  const transcriptEl=document.getElementById('transcript');
  const responseEl=document.getElementById('response');

  const STATE_LABEL={idle:'STANDING BY',listening:'LISTENING…',thinking:'WORKING…',speaking:'SPEAKING'};
  const TOOL_LABEL={get_email_summary:'GMAIL',get_calendar_today:'CALENDAR',get_tasks:'TASKS',get_weather:'WEATHER',get_news:'NEWS'};

  function setState(s){
    document.body.className=s||'';
    statusEl.textContent=STATE_LABEL[s]||s||'';
    if(s==='listening'||s==='idle'){ toolsEl.innerHTML=''; }
    if(s==='listening'){ responseEl.textContent=''; transcriptEl.textContent=''; }
  }
  function setLevel(rms){
    const scale=1+Math.min(0.6,(rms||0)*0.9);
    core.style.transform=`scale(${scale})`;
  }
  function addTool(name){
    const c=document.createElement('div');c.className='chip';
    c.textContent='ACCESSING '+(TOOL_LABEL[name]||name.toUpperCase());
    toolsEl.appendChild(c);
  }

  function connect(){
    const ws=new WebSocket('ws://127.0.0.1:8765');
    ws.onopen=()=>{ setState('idle'); };
    ws.onclose=()=>{ statusEl.textContent='OFFLINE'; setTimeout(connect,1500); };
    ws.onerror=()=>{ try{ws.close()}catch(e){} };
    ws.onmessage=(ev)=>{
      let m; try{ m=JSON.parse(ev.data) }catch(e){ return; }
      switch(m.type){
        case 'state': setState(m.value); break;
        case 'level': setLevel(m.rms); break;
        case 'transcript': transcriptEl.textContent='“'+m.text+'”'; break;
        case 'tool': addTool(m.name); break;
        case 'response':
          if(m.final) return;
          responseEl.textContent=(responseEl.textContent?responseEl.textContent+' ':'')+m.text;
          break;
        case 'error': statusEl.textContent='ERROR'; responseEl.textContent=m.message||''; break;
      }
    };
  }
  // Fade in immediately; Swift shows this window only during an interaction.
  requestAnimationFrame(()=>stage.classList.add('on'));
  connect();
})();
</script>
</body>
</html>
